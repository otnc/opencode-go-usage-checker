<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!-- Three usage windows: 5-hour, weekly, monthly — drawn as a gauge -->
  <path d="M4 16a8 8 0 0 1 16 0" opacity="0.4"/>
  <path d="M4 16a8 8 0 0 1 8-8"/>
  <path d="M12 8a8 8 0 0 1 8 8" opacity="0.7"/>
  <!-- Needle pointing to ~70% -->
  <path d="M12 16l5-3.5"/>
  <circle cx="12" cy="16" r="1.3" fill="currentColor" stroke="none"/>
  <!-- Tick marks for the three thresholds -->
  <path d="M6.3 11.5l1 1.6" opacity="0.5"/>
  <path d="M17.7 11.5l-1 1.6" opacity="0.5"/>
</svg>
